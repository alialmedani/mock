<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP App Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDEFF3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:start;transition:transform .14s ease,background .16s ease,color .16s ease,opacity .16s ease}
.scr button:active{transform:scale(.965)}
.stage{width:1200px;height:892px;padding:16px 20px;display:flex;gap:32px;background:#EDEFF3;color:#2C3E50;font-family:Cairo,system-ui,sans-serif;font-size:14px;line-height:1.4;overflow:hidden}
.side{width:300px;flex:none;display:flex;flex-direction:column;gap:16px;padding-top:6px}
.side.r{width:390px;gap:8px}
.side h1{font-size:23px;line-height:1.2;font-weight:var(--w-bold);margin:0}
.side h2{font-size:12px;font-weight:var(--w-bold);color:#475569;margin:0 0 6px}
.side p{margin:4px 0 0;color:#475569;font-size:13px}
.rseg{display:flex;background:#DDE3EC;border-radius:11px;padding:3px;gap:3px}
.rseg button{flex:1;height:36px;border-radius:8px;text-align:center;font-weight:var(--w-semibold);font-size:13px}
.rseg button.on{background:#2C3E50;color:#fff}
.jump{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.jump button{height:38px;padding:0 11px;border-radius:10px;background:#fff;font-size:13px;font-weight:var(--w-semibold)}
.jump button.on{background:#2C3E50;color:#fff}
.reset{height:38px;border-radius:10px;border:1px solid #B8C2D0;text-align:center;font-weight:var(--w-semibold);font-size:13px}
.pc{display:block;width:100%;padding:9px 12px;border-radius:15px;background:#fff;border:2px solid transparent}
.pc.on{border-color:var(--c-action)}
.pc-h{display:flex;justify-content:space-between;gap:8px;font-weight:var(--w-bold)}
.pc-h>span:last-child{font-weight:var(--w-semibold);font-size:12px;color:#475569}
.pc-r{display:block;font-size:12px;color:#475569;margin:0 0 6px}
.mini{display:flex;justify-content:space-around;align-items:center;height:38px;background:#F5F7FA;border-radius:12px;color:#475569}
.mini>span{display:flex;flex-direction:column;align-items:center;font-size:9.5px;line-height:1.1;width:68px;gap:1px}
.mini .i{width:14px;height:14px}

.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.i.s{width:18px;height:18px}.i.xs{width:14px;height:14px}.i.l{width:26px;height:26px}
[dir=rtl] .flip{transform:scaleX(-1)}
.phone{width:406px;height:860px;flex:none;padding:8px;border-radius:52px;background:#18212D;box-shadow:0 24px 50px rgba(44,62,80,.22)}
.scr{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;font-size:14px;line-height:1.4}
/* ===== DESIGN TOKENS: values taken from the attendance2 app (AppColors, AppTextStyle, shared widgets) ===== */
:root{--font:Cairo,system-ui,sans-serif;--w-regular:400;--w-medium:500;--w-semibold:600;--w-bold:700;
--fs-appbar:17px;--fs-form-title:19px;--fs-hero:20px;--fs-amount:22px;--fs-section:16px;--fs-card-title:15.5px;--fs-detail-title:15px;--fs-form-section:14px;--fs-body:13.5px;--fs-label:13px;--fs-sub:12.5px;--fs-small:12px;--fs-meta:11.5px;--fs-pill:11px;--fs-kv:10px;
--r-chip:8px;--r-icon-sm:10px;--r-input:12px;--r-control:14px;--r-button:15px;--r-action:16px;--r-card:20px;--r-panel:22px;--r-hero:24px;--r-pill:999px;
--s-6:6px;--s-10:10px;--s-12:12px;--s-14:14px;--s-16:16px;
--c-action:#2C3E50;--c-danger:#D32F2F;--c-toast:#18212D;--on-navy:#fff;--on-navy-muted:rgba(255,255,255,.72);--on-navy-fill:rgba(255,255,255,.12);--on-navy-line:rgba(255,255,255,.2);
--g-create:linear-gradient(90deg,#27B463,#1F9D57);--c-create:#1F9D57;--g-destroy:linear-gradient(90deg,#E5555A,#C02B30);--g-report:linear-gradient(180deg,#2A3B50,#213141)}
.t-light{--c-background:#FAFAFA;--c-card:#FFFFFF;--c-doc-card:#FFFFFF;--c-primary:#2C3E50;--c-title:#000000;--c-muted:#94A3B8;--c-border:#EDEFF3;--c-input-border:#EDEFF3;--c-accent:#2C3E50;--c-action:#2C3E50;--g-action:linear-gradient(90deg,#3E5871,#2C3E50);--c-navy:#2C3E50;--g-form:linear-gradient(135deg,#37506A,#263647);--c-soft:#F3F4F6;--c-shadow:rgba(0,0,0,.04);--c-ok:#20A45B;--c-warn:#BA6700;--c-bad:#D32F2F;
--sh-doc:0 12px 24px -8px rgba(0,0,0,.06);--sh-form:0 10px 24px rgba(0,0,0,.06);--sh-step:0 10px 26px rgba(0,0,0,.10);--sh-lift:0 12px 24px -8px rgba(44,62,80,.09);--sh-hub:0 3px 8px rgba(0,0,0,.04),0 16px 26px rgba(0,0,0,.04)}
.t-dark{color-scheme:dark;--c-background:#222C3B;--c-card:#2D3A4D;--c-doc-card:#20293A;--c-primary:#F7FAFF;--c-title:#FFFFFF;--c-muted:#D0DAEC;--c-border:#425671;--c-input-border:#55698A;--c-accent:#9ABEFF;--c-action:#2563EB;--g-action:linear-gradient(90deg,#2F6FED,#1D4ED8);--c-navy:#18212D;--g-form:linear-gradient(135deg,#243244,#161F2B);--c-soft:#273244;--c-shadow:rgba(0,0,0,.086);--c-ok:#9CE7AD;--c-warn:#FFCC65;--c-bad:#DF7577;
--sh-doc:0 12px 24px -8px rgba(0,0,0,.32);--sh-form:0 10px 24px rgba(0,0,0,.30);--sh-step:0 10px 26px rgba(0,0,0,.34);--sh-lift:0 12px 24px -8px rgba(0,0,0,.32);--sh-hub:0 3px 8px rgba(0,0,0,.086),0 16px 26px rgba(0,0,0,.086)}
.t-light,.t-dark{--bg:var(--c-background);--sf:var(--c-card);--sf2:var(--c-soft);--ink:var(--c-primary);--mut:var(--c-muted);--line:var(--c-border);--hero:var(--c-navy);--dock:var(--c-card);--pri:var(--c-action);--priT:#fff;--acc:var(--c-action);--accT:#fff;--link:var(--c-accent);--mk:color-mix(in srgb,var(--c-action) 18%,transparent);--mkT:var(--c-primary);--sh:var(--sh-hub);--ok:var(--c-ok);--okb:color-mix(in srgb,var(--c-ok) 12%,transparent);--warn:var(--c-warn);--warnb:color-mix(in srgb,var(--c-warn) 12%,transparent);--bad:var(--c-bad);--badb:color-mix(in srgb,var(--c-bad) 12%,transparent)}
.t-light{--logoT:#032142}.t-dark{--logoT:#fff}
.t-light .m-core,.t-dark .m-core{--mb:var(--c-primary);--m:var(--c-primary);--mt:color-mix(in srgb,var(--c-primary) 9%,transparent);--mr:color-mix(in srgb,var(--c-primary) 16%,transparent);--ms:transparent}
.m-sales{--mb:#EA580C;--m:#EA580C;--mt:rgba(234,88,12,.24);--mr:rgba(234,88,12,.28);--ms:rgba(234,88,12,.14)}.m-purchasing{--mb:#7C3AED;--m:#7C3AED;--mt:rgba(124,58,237,.24);--mr:rgba(124,58,237,.28);--ms:rgba(124,58,237,.14)}.m-inventory{--mb:#0891B2;--m:#0891B2;--mt:rgba(8,145,178,.24);--mr:rgba(8,145,178,.28);--ms:rgba(8,145,178,.14)}.m-finance{--mb:#059669;--m:#059669;--mt:rgba(5,150,105,.24);--mr:rgba(5,150,105,.28);--ms:rgba(5,150,105,.14)}.m-hr{--mb:#2563EB;--m:#2563EB;--mt:rgba(37,99,235,.24);--mr:rgba(37,99,235,.28);--ms:rgba(37,99,235,.14)}.m-mgmt{--mb:#DB2777;--m:#DB2777;--mt:rgba(219,39,119,.24);--mr:rgba(219,39,119,.28);--ms:rgba(219,39,119,.14)}.m-pos{--mb:#DC2626;--m:#DC2626;--mt:rgba(220,38,38,.24);--mr:rgba(220,38,38,.28);--ms:rgba(220,38,38,.14)}.m-dms{--mb:#B45309;--m:#B45309;--mt:rgba(180,83,9,.24);--mr:rgba(180,83,9,.28);--ms:rgba(180,83,9,.14)}.m-mfg{--mb:#475569;--m:#475569;--mt:rgba(71,85,105,.24);--mr:rgba(71,85,105,.28);--ms:rgba(71,85,105,.14)}.m-freight{--mb:#0D9488;--m:#0D9488;--mt:rgba(13,148,136,.24);--mr:rgba(13,148,136,.28);--ms:rgba(13,148,136,.14)}.m-forms{--mb:#4338CA;--m:#4338CA;--mt:rgba(67,56,202,.24);--mr:rgba(67,56,202,.28);--ms:rgba(67,56,202,.14)}
.t-dark .m-sales{--m:#FABE9F;--mt:rgba(250,190,159,.28);--mr:rgba(250,190,159,.35);--ms:rgba(250,190,159,.18)}.t-dark .m-purchasing{--m:#DFD0FB;--mt:rgba(223,208,251,.28);--mr:rgba(223,208,251,.35);--ms:rgba(223,208,251,.18)}.t-dark .m-inventory{--m:#65DCF8;--mt:rgba(101,220,248,.28);--mr:rgba(101,220,248,.35);--ms:rgba(101,220,248,.18)}.t-dark .m-finance{--m:#45F9C1;--mt:rgba(69,249,193,.28);--mr:rgba(69,249,193,.35);--ms:rgba(69,249,193,.18)}.t-dark .m-hr{--m:#BACEF9;--mt:rgba(186,206,249,.28);--mr:rgba(186,206,249,.35);--ms:rgba(186,206,249,.18)}.t-dark .m-mgmt{--m:#F2B3CF;--mt:rgba(242,179,207,.28);--mr:rgba(242,179,207,.35);--ms:rgba(242,179,207,.18)}.t-dark .m-pos{--m:#F3B3B3;--mt:rgba(243,179,179,.28);--mr:rgba(243,179,179,.35);--ms:rgba(243,179,179,.18)}.t-dark .m-dms{--m:#F7A669;--mt:rgba(247,166,105,.28);--mr:rgba(247,166,105,.35);--ms:rgba(247,166,105,.18)}.t-dark .m-mfg{--m:#99A7BA;--mt:rgba(153,167,186,.28);--mr:rgba(153,167,186,.35);--ms:rgba(153,167,186,.18)}.t-dark .m-freight{--m:#54F0E2;--mt:rgba(84,240,226,.28);--mr:rgba(84,240,226,.35);--ms:rgba(84,240,226,.18)}.t-dark .m-forms{--m:#BDB9EC;--mt:rgba(189,185,236,.28);--mr:rgba(189,185,236,.35);--ms:rgba(189,185,236,.18)}



.tile{width:42px;height:42px;border-radius:13px;background:var(--mt);color:var(--m);display:flex;align-items:center;justify-content:center;flex:none}
.tile.sm{width:38px;height:38px;border-radius:12px}
.tile.lg{width:54px;height:54px;border-radius:17px}
.tile.solid{background:var(--mb);color:#fff}
.ava{width:40px;height:40px;border-radius:50%;background:var(--mt);color:var(--m);font-size:13px;font-weight:var(--w-bold);display:flex;align-items:center;justify-content:center;flex:none}

.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:110px;scrollbar-width:none}
.view::-webkit-scrollbar,.hs::-webkit-scrollbar,.sheet-b::-webkit-scrollbar{display:none}
.view.nodock{padding-bottom:104px}
.nv-fw{animation:fw .24s cubic-bezier(.2,.8,.2,1)}.nv-bk{animation:bk .24s cubic-bezier(.2,.8,.2,1)}.nv-fade{animation:fd .2s ease-out}
[dir=rtl] .nv-fw{animation-name:bk}[dir=rtl] .nv-bk{animation-name:fw}
@keyframes fw{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes bk{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stag>*{animation:fd .34s cubic-bezier(.2,.8,.2,1) both}.stag>*:nth-child(2){animation-delay:.04s}.stag>*:nth-child(3){animation-delay:.08s}.stag>*:nth-child(4){animation-delay:.12s}.stag>*:nth-child(5){animation-delay:.16s}.stag>*:nth-child(6){animation-delay:.2s}
@keyframes jig{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.scr *{animation:none!important;transition:none!important}}
.pad{padding:0 16px}
.ib{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.ib.tint{background:var(--sf);color:var(--ink);box-shadow:var(--sh);border:1px solid var(--line)}
.ib.on{color:var(--link)}.ib.on .i{fill:var(--link)}
.dot{position:absolute;top:-4px;inset-inline-end:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--acc);color:#fff;border:2px solid var(--bg);font-size:10.5px;font-weight:var(--w-bold);line-height:15px;text-align:center}
.logo{width:96px;height:28px;display:block;flex:none}.logo .lt{fill:var(--logoT)}.grow{flex:1}
.wm{position:absolute;inset-inline-end:-34px;bottom:-46px;width:190px;height:158px;fill:#fff;opacity:.03;pointer-events:none}
.head{padding:16px 16px 0}
.head-top{display:flex;align-items:center;gap:8px}
.hello{margin-top:14px}
.hello b{display:block;font-size:25px;font-weight:var(--w-bold);line-height:1.25;letter-spacing:-.2px}
[dir=rtl] .hello b{letter-spacing:0}
.hello>span{display:block;font-size:13px;color:var(--mut);margin-top:1px}
.hs,.quick,.chips{cursor:grab}.dragging,.dragging *{cursor:grabbing!important;user-select:none}
.sbar{display:flex;align-items:center;gap:10px;height:54px;width:100%;margin-top:14px;padding:0 8px 0 16px;background:var(--sf);color:var(--mut);border:1px solid var(--line);border-radius:18px;font-weight:var(--w-medium);box-shadow:var(--sh)}
[dir=rtl] .sbar{padding:0 16px 0 8px}
.sbar>svg:first-child{color:var(--link)}
.sbar em{margin-inline-start:auto;font-style:normal;width:38px;height:38px;border-radius:12px;background:var(--sf2);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 16px;margin:0 -16px;scroll-padding:0 16px}
.hs>*{scroll-snap-align:start;flex:none}
.kc{position:relative;overflow:hidden;width:300px;min-height:132px;padding:15px 16px;border-radius:24px;background:var(--hero);color:#fff;display:block}
.kc.solo{width:358px}
.kc small{display:block;font-size:12.5px;color:#D0DAEC;font-weight:var(--w-semibold)}
.kc-m{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:4px}
.kc b{font-size:31px;font-weight:var(--w-bold);line-height:1.15}
.kc b i{font-style:normal;font-size:13px;font-weight:var(--w-semibold);margin-inline-start:4px;color:#D0DAEC}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:var(--w-semibold);color:#D0DAEC;margin-top:6px}
.bars{display:flex;align-items:flex-end;gap:4px;height:48px;flex:none}
.bars u{display:block;width:8px;min-height:4px;border-radius:4px 4px 0 0;background:rgba(255,255,255,.28)}
.bars u:last-child{background:#5AA2FF}
.chk{display:flex;align-items:center;gap:11px;padding:9px 9px 9px 12px;margin-top:10px;background:var(--sf);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
[dir=rtl] .chk{padding:9px 12px 9px 9px}
.chk .tx b{font-size:13.5px}
.cta{height:44px;padding:0 16px;border-radius:14px;background:var(--acc);color:#fff;font-weight:var(--w-bold);font-size:13px;flex:none}
.cta.alt{background:var(--sf2);color:var(--ink)}
.sec{margin-top:24px}
.sec-h{display:flex;align-items:center;justify-content:space-between;min-height:30px;margin-bottom:9px}
.sec-h h3{font-size:16.5px;font-weight:var(--w-bold);margin:0}
.lnk{min-height:44px;margin:-7px 0;padding:0 2px;font-size:13px;font-weight:var(--w-bold);color:var(--link)}
.pins{display:grid;gap:12px 8px}
.c1,.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pw{position:relative;min-width:0}
.pin{width:100%;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;font-size:12px;font-weight:var(--w-bold);line-height:1.25}
.pin .tile{width:60px;height:60px;border-radius:19px;box-shadow:0 8px 16px -8px var(--mb)}
.pin .i{width:26px;height:26px}
.pin.add .tile{background:none;border:1.5px dashed var(--mut);color:var(--mut);box-shadow:none}
.pin.add{color:var(--mut)}
.editing .pin .tile{animation:jig .32s ease-in-out infinite}
.pw:nth-child(even) .pin .tile{animation-delay:.1s}
.rm{position:absolute;top:-8px;inset-inline-end:calc(50% - 44px);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);animation:pop .2s}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rc{width:142px;padding:12px;background:var(--sf);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);display:block;min-height:112px}
.rc b{display:block;margin-top:9px;font-size:13px;font-weight:var(--w-bold);line-height:1.3}
.rc small{display:block;font-size:11.5px;color:var(--mut);margin-top:2px}
.tx{min-width:0;flex:1}
.tx b{display:block;font-size:14px;font-weight:var(--w-bold);line-height:1.3}
.tx small{display:block;font-size:12px;color:var(--mut);line-height:1.35}
.card{background:var(--sf);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;align-items:center;min-height:62px;padding-inline-end:8px;position:relative}
.row+.row::before,.rowsep{content:"";position:absolute;top:0;inset-inline-start:62px;inset-inline-end:0;height:1px;background:var(--line)}
.row-m{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 0;padding-inline-start:12px;min-height:62px}
.okb{width:44px;height:44px;border-radius:50%;background:var(--okb);color:var(--ok);display:flex;align-items:center;justify-content:center;flex:none}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 6px}
.mg{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:var(--w-semibold);text-align:center;line-height:1.2;min-height:76px}
.mg .tile{width:52px;height:52px;border-radius:17px}
.mg.cur .tile{background:var(--mb);color:#fff}
.mcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mc{position:relative;overflow:hidden;border-radius:21px;background:var(--mt);min-height:128px}
.mc-b{display:block;width:100%;height:100%;padding:13px;min-height:128px}
.mc-b b{display:block;margin-top:13px;font-size:14.5px;font-weight:var(--w-bold);line-height:1.25}
.mc-b small{font-size:12px;color:var(--mut)}
.mc .big{position:absolute;inset-inline-end:-14px;bottom:-14px;width:78px;height:78px;color:var(--m);opacity:.12;stroke-width:1.3;pointer-events:none}
.mc .ib{position:absolute;top:2px;inset-inline-end:2px;color:var(--mut)}.mc .ib.on{color:var(--link)}

.bar{display:flex;align-items:center;gap:2px;min-height:60px;padding:8px;flex:none;position:relative;z-index:1}
.bar-t{flex:1;min-width:0;padding:0 6px}
.bar-t h2{font-size:19px;font-weight:var(--w-bold);margin:0;line-height:1.25}
.crumb{display:inline-flex;align-items:center;min-height:18px;font-size:12px;font-weight:var(--w-semibold);color:var(--mut)}
.bar.band{background:color-mix(in srgb,var(--mb) 76%,#0B1726);color:#fff;margin-bottom:-1px;box-shadow:0 1px 0 color-mix(in srgb,var(--mb) 76%,#0B1726)}
.band .crumb{color:#fff}.band .ib.on{color:#fff}.band .ib.on .i{fill:#fff}
.hubh{position:relative;overflow:hidden;background:color-mix(in srgb,var(--mb) 76%,#0B1726);color:#fff;padding:2px 18px 46px;border-radius:0 0 28px 28px}
.hubh small{font-size:12.5px;font-weight:var(--w-semibold);color:#fff;opacity:.9;display:block}

.mc-b{display:flex;flex-direction:column;align-items:center;width:100%;min-height:0;padding:0;text-align:center}
.mc-b .tile{position:relative;width:58px;height:58px;border-radius:var(--r-card)}.mc-b .tile .i{width:25px;height:25px}
.mc-b b{width:100%;margin-top:7px;font-size:var(--fs-small);font-weight:var(--w-semibold);line-height:1.25;color:var(--c-primary)}
.need{position:absolute;top:-6px;inset-inline-end:-6px;display:flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border:2px solid var(--c-background);border-radius:var(--r-pill);background:var(--c-action);color:#fff;font-size:10px;font-weight:var(--w-bold);line-height:1}
.mc .ib{top:-6px;inset-inline:calc(50% - 35px) auto;width:22px;height:22px;opacity:0;pointer-events:none;background:var(--c-card);border:1px solid var(--c-border);color:var(--c-muted)}.mc .ib .i{width:12px;height:12px}
.mc .ib::after{content:"";position:absolute;inset:-10px}
.mc .ib.on{opacity:1;color:var(--c-accent)}
.mcards.jig .mc .ib{opacity:1;pointer-events:auto}
.r-modules .view>.pad{padding-top:var(--s-10)}
.sortbar~.toast{bottom:158px}
.ap-t{display:block;margin-top:10px;font-size:var(--fs-detail-title);font-weight:var(--w-bold);line-height:1.35;color:var(--c-primary)}
.ahero{margin-top:14px;padding:20px;text-align:center;background:var(--c-card);border:1px solid var(--c-border);border-radius:16px}
.ah-div{height:1px;margin:8px 0 16px;background:var(--c-border)}
.ah-row{display:flex;justify-content:space-evenly;align-items:flex-start;gap:8px}
.ah-date{color:var(--c-muted);font-size:13px;font-weight:600}
.ah-time{color:var(--c-primary);font-size:22px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.ah-hint{margin:20px 0 16px;color:var(--c-muted);font-size:14px;font-weight:600}
.ah-fp{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;margin-bottom:14px;border-radius:50%;background:var(--c-primary);border:2px solid var(--c-border);color:var(--c-background)}
.ah-fp .i{width:36px;height:36px;stroke-width:1.8}
.ah-fp:active{transform:scale(.94)}
.at-h h3{flex:1;text-align:center;font-size:15.5px;font-weight:600}
.at-ib{display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex:none;border-radius:14px;background:color-mix(in srgb,var(--c-primary) 6%,transparent);border:1px solid color-mix(in srgb,var(--c-primary) 10%,transparent);color:var(--c-primary)}
.at-list{display:flex;flex-direction:column;gap:12px;padding:4px 0 2px}
.at-t{--ac:var(--c-primary);position:relative;display:flex;align-items:center;gap:12px;width:100%;height:64px;padding:0 18px 0 12px;border-radius:20px;background:var(--c-card);border:1px solid var(--c-border);box-shadow:0 10px 14px rgba(0,0,0,.04);color:var(--c-primary);transition:background .16s,box-shadow .16s}
.at-t::after{content:"";position:absolute;right:12px;top:14px;bottom:14px;width:4px;border-radius:99px;background:var(--ac);opacity:.65}
.at-t b{flex:1;text-align:center;font-size:14.5px;font-weight:500}
.at-c{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border-radius:50%}
.at-l{background:color-mix(in srgb,var(--c-primary) 6%,transparent);border:1px solid color-mix(in srgb,var(--c-primary) 10%,transparent)}
.at-r{background:color-mix(in srgb,var(--ac) 10%,transparent);border:1px solid color-mix(in srgb,var(--ac) 22%,transparent);color:var(--ac)}
.at-sp{--ac:var(--c-accent)}.at-out{--ac:#1E88E5}
.at-t.on{background:var(--c-primary);border-color:transparent;color:var(--c-background);box-shadow:0 10px 18px rgba(0,0,0,.10)}
.at-t.on .at-c{background:color-mix(in srgb,var(--c-background) 12%,transparent);border-color:color-mix(in srgb,var(--c-background) 18%,transparent);color:var(--c-background)}
.at-t.on::after{opacity:.55}
.listhead .ltabs:last-child{margin-bottom:0}.listhead .ltabs{margin:0 0 12px;padding:4px;height:48px;background:var(--on-navy-fill);border:1px solid var(--on-navy-line);border-radius:var(--r-control)}.listhead .ltabs button{height:38px;color:var(--on-navy-muted);font-size:var(--fs-body);font-weight:var(--w-semibold);transition:background .15s,color .15s}.listhead .ltabs button.on{background:#fff;color:#2C3E50;font-weight:var(--w-bold);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.hr-rules{display:flex;flex-direction:column;align-items:stretch;gap:6px}.hr-rules .pc-r{display:block}
.bm-on{color:var(--c-accent);stroke-width:2.4}

html,body{height:100%}
body:not(.narrow) .stage{margin:0 auto;overflow:visible}
body.narrow{height:auto}
body.narrow .stage{width:auto;height:auto;min-height:100vh;flex-direction:column;align-items:center;padding:6px 6px 28px;gap:20px;overflow:visible}
body.narrow .side,body.narrow .side.r{width:100%;max-width:420px;padding:0 8px}
body.narrow .phone{order:-1}</style>
</head>
<body>
<div id="app"></div>
<template id="view">

<div class="stage">
  <div class="side">
    <div><h1>App redesign</h1><p>Everything inside the phone works. All names and figures are sample data.</p></div>
    <div><h2>Language</h2><div class="rseg"><sc-for list="{{langs}}" as="o" hint-placeholder-count="2"><button class="{{o.cls}}" onClick="{{o.go}}">{{o.label}}</button></sc-for></div></div>
    <div><h2>Theme</h2><div class="rseg"><sc-for list="{{themes}}" as="o" hint-placeholder-count="2"><button class="{{o.cls}}" onClick="{{o.go}}">{{o.label}}</button></sc-for></div></div>
    <div><h2>Jump to a screen</h2><div class="jump"><sc-for list="{{jumps}}" as="o" hint-placeholder-count="10"><button class="{{o.cls}}" onClick="{{o.go}}">{{o.label}}</button></sc-for></div></div>
    <button class="reset" onClick="{{reset}}">Reset the demo</button>
  </div>

  <div class="phone"><div class="scr {{themeCls}} r-{{routeN}}" dir="{{dir}}" lang="{{lang}}">

    <sc-if value="{{hasBar}}" hint-placeholder-val="{{false}}">
      <div class="bar {{barCls}}">
        <sc-if value="{{canBack}}" hint-placeholder-val="{{false}}"><button class="ib" aria-label="{{t.back}}" onClick="{{back}}"><svg class="i flip" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.back}}"></path></svg></button></sc-if>
        <div class="bar-t">
          <sc-if value="{{crumb}}" hint-placeholder-val="{{false}}"><button class="crumb" onClick="{{crumb.go}}">{{crumb.label}}</button></sc-if>
          <h2 class="one">{{barTitle}}</h2>
        </div>
      </div>
    </sc-if>

    <div class="view {{viewCls}} nv-{{nav}}" key="{{viewKey}}">

      <sc-if value="{{is.home}}" hint-placeholder-val="{{true}}">
        <div class="head">
          <div class="head-top">
            <svg class="logo" viewBox="30 390 1033 300" role="img" aria-label="ERP"><path fill="#006DFF" d="M376.01,399.98v255.86h-100.02v-155.84H120.15v-100.02h255.86Z"></path><path fill="#006DFF" d="M40.39,589.34h59.17c12.03,0,23.56-4.77,32.06-13.28l38.11-38.11,64.11,64.11-38.11,38.11c-25.51,25.51-60.1,39.84-96.18,39.84h-59.17v-90.67h.01Z"></path><path class="lt" d="M414.15,403.95c0-2.5,1.25-3.76,3.76-3.76h163.78c2.5,0,3.76,1.26,3.76,3.76v40.19c0,2.51-1.26,3.76-3.76,3.76h-110.06c-1.5,0-2.25.75-2.25,2.25v50.71c0,1.5.75,2.25,2.25,2.25h91.66c2.5,0,3.76,1.25,3.76,3.76v39.82c0,2.51-1.26,3.76-3.76,3.76h-91.66c-1.5,0-2.25.75-2.25,2.25v52.97c0,1.5.75,2.25,2.25,2.25h110.06c2.5,0,3.76,1.26,3.76,3.76v40.19c0,2.51-1.26,3.76-3.76,3.76h-163.78c-2.51,0-3.76-1.25-3.76-3.76v-247.93h0Z"></path><path class="lt" d="M767.64,655.63c-2.76,0-4.64-1.25-5.63-3.76l-43.95-93.54h-34.18c-1.5,0-2.25.75-2.25,2.25v91.28c0,2.51-1.26,3.76-3.76,3.76h-47.71c-2.51,0-3.76-1.25-3.76-3.76v-247.93c0-2.5,1.25-3.76,3.76-3.76h101.8c13.02,0,24.85,1.94,35.5,5.82,10.64,3.89,19.78,9.33,27.42,16.34,7.64,7.01,13.52,15.4,17.66,25.17,4.13,9.77,6.2,20.41,6.2,31.93,0,16.53-4.01,30.93-12.02,43.2-8.02,12.27-19.16,21.54-33.43,27.8l50.34,100.67c.5,1.26.5,2.32,0,3.19-.5.88-1.38,1.32-2.63,1.32h-53.34l-.02.02ZM728.94,511.39c10.52,0,18.91-2.88,25.17-8.64s9.39-13.52,9.39-23.29-3.13-17.15-9.39-22.91-14.65-8.64-25.17-8.64h-45.08c-1.5,0-2.25.75-2.25,2.25v58.98c0,1.5.75,2.25,2.25,2.25h45.08Z"></path><path class="lt" d="M864.55,655.63c-2.51,0-3.76-1.25-3.76-3.76v-247.93c0-2.5,1.25-3.76,3.76-3.76h99.17c13.77,0,26.17,2.01,37.19,6.01,11.02,4.01,20.41,9.64,28.17,16.9,7.76,7.27,13.65,15.91,17.65,25.92,4,10.02,6.01,21.17,6.01,33.43s-2.07,23.04-6.2,33.06c-4.13,10.02-10.02,18.66-17.65,25.92-7.64,7.27-16.97,12.9-27.99,16.9-11.02,4.01-23.42,6.01-37.19,6.01h-45.45c-1.5,0-2.25.75-2.25,2.25v85.27c0,2.51-1.26,3.76-3.76,3.76h-47.71v.02ZM960.34,516.65c11.77,0,20.91-3.06,27.42-9.2,6.51-6.13,9.77-14.46,9.77-24.98s-3.26-18.91-9.77-25.17-15.65-9.39-27.42-9.39h-42.07c-1.5,0-2.25.75-2.25,2.25v64.23c0,1.5.75,2.25,2.25,2.25h42.07Z"></path></svg>
            <span class="grow"></span>
            <sc-if value="{{showQr}}" hint-placeholder-val="{{false}}"><button class="ib tint" aria-label="{{t.scan}}" onClick="{{goScan}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.qr}}"></path></svg></button></sc-if>
            <button class="ib tint" aria-label="{{t.alerts}}" onClick="{{goInbox}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.bell}}"></path></svg><sc-if value="{{inboxN}}" hint-placeholder-val="{{false}}"><span class="dot">{{inboxN}}</span></sc-if></button>
          </div>
          <div class="hello"><b>{{t.morning}}, {{P.first}}</b><span>{{t.dateLine}}</span></div>
          <sc-if value="{{showSearch}}" hint-placeholder-val="{{true}}"><button class="sbar" onClick="{{goSearch}}"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.search}}"></path></svg>{{t.searchHint}}</button></sc-if>
        </div>
        <div class="pad stag">
          <sc-if value="{{showAtt}}" hint-placeholder-val="{{false}}"><div class="ahero"><div class="ah-div"></div><div class="ah-row"><span class="ah-date">{{ah.date}}</span><span class="ah-time" dir="ltr">{{ah.time}}</span></div><p class="ah-hint">{{ah.hint}}</p><button class="ah-fp" aria-label="{{ah.hint}}" onClick="{{ah.open}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.fp}}"></path></svg></button></div></sc-if>
          <sc-if value="{{kpis.length}}" hint-placeholder-val="{{true}}">
            <div style="margin-top:14px"><div class="hs">
              <sc-for list="{{kpis}}" as="k" hint-placeholder-count="2">
                <button class="kc {{kpiCls}}" onClick="{{k.go}}" aria-label="{{k.aria}}"><svg class="wm" viewBox="30 390 360 300" aria-hidden="true"><path d="{{ic.markA}}"></path><path d="{{ic.markB}}"></path></svg><small>{{k.label}}</small><span class="kc-m"><span><b>{{k.v}}<i>{{k.s}}</i></b><br><span class="delta"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="{{k.arrow}}"></path></svg>{{k.d}}</span></span><span class="bars" aria-hidden="true"><sc-for list="{{k.bars}}" as="b" hint-placeholder-count="7"><u style="height:{{b.h}}px" title="{{b.t}}"></u></sc-for></span></span></button>
              </sc-for>
            </div></div>
          </sc-if>
          <sc-if value="{{noAccess}}" hint-placeholder-val="{{false}}">
            <div class="card" style="margin-top:18px"><div class="empty"><div class="tile lg m-core"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.shield}}"></path></svg></div><b>{{t.noAccess}}</b>{{t.noAccessSub}}</div></div>
          </sc-if>
          <sc-if value="{{hasMods}}" hint-placeholder-val="{{true}}">
            <sc-if value="{{showPins}}" hint-placeholder-val="{{true}}"><div class="sec {{pinEditCls}}">
              <div class="sec-h"><h3>{{t.pinned}}</h3><button class="lnk" onClick="{{toggleEdit}}">{{editLabel}}</button></div>
              <div class="pins {{pinCols}} {{pinJig}}" data-sort="pins">
                <sc-for list="{{pinned}}" as="e" hint-placeholder-count="4">
                  <div class="pw {{e.cls}}" data-id="{{e.id}}"><button class="pin" onClick="{{e.tap}}"><span class="tile solid"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{e.icon}}"></path></svg></span><span class="clamp">{{e.title}}</span></button><sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><button class="rm" aria-label="{{t.remove}}" onClick="{{e.pin}}"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.x}}"></path></svg></button></sc-if></div>
                </sc-for>
                <sc-if value="{{canAddPin}}" hint-placeholder-val="{{false}}"><div class="pw"><button class="pin add" onClick="{{openPins}}"><span class="tile"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.plus}}"></path></svg></span>{{t.addPin}}</button></div></sc-if>
              </div>
            </div></sc-if>
            <sc-if value="{{homeGrid.length}}" hint-placeholder-val="{{true}}"><div class="sec"><div class="sec-h"><h3>{{gridTitle}}</h3></div>
              <div class="mgrid {{homeJig}}" data-sort="home"><sc-for list="{{homeGrid}}" as="e" hint-placeholder-count="8"><button class="mg {{e.cls}}" data-id="{{e.id}}" onClick="{{e.go}}"><span class="tile"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{e.icon}}"></path></svg></span><span class="clamp">{{e.short}}</span></button></sc-for></div>
            </div></sc-if>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{is.search}}" hint-placeholder-val="{{false}}">
        <div class="pad" style="padding-top:18px">
          <label class="field"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.search}}"></path></svg><input id="sq" aria-label="{{t.searchHint}}" placeholder="{{t.searchHint}}" value="{{q}}" onChange="{{onQ}}"><sc-if value="{{q}}" hint-placeholder-val="{{false}}"><button aria-label="{{t.clear}}" onClick="{{clearQ}}"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.x}}"></path></svg></button></sc-if></label>
          <sc-if value="{{sr.idle}}" hint-placeholder-val="{{true}}">
            <div class="lab">{{t.tryThese}}</div>
            <div class="chips wrap"><sc-for list="{{sr.tries}}" as="c" hint-placeholder-count="4"><button class="chip" onClick="{{c.go}}">{{c.label}}</button></sc-for></div>
            <sc-if value="{{sr.acts.length}}" hint-placeholder-val="{{true}}"><div class="lab">{{t.quickCreate}}</div><div class="quick" style="padding-top:0"><sc-for list="{{sr.acts}}" as="e" hint-placeholder-count="3"><button class="qk {{e.cls}}" onClick="{{e.go}}"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.plus}}"></path></svg>{{e.short}}</button></sc-for></div></sc-if>
            <sc-if value="{{sr.mods.length}}" hint-placeholder-val="{{true}}"><div class="lab">{{t.browse}}</div><div class="mgrid"><sc-for list="{{sr.mods}}" as="e" hint-placeholder-count="8"><button class="mg {{e.cls}}" onClick="{{e.go}}"><span class="tile"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{e.icon}}"></path></svg></span><span class="clamp">{{e.short}}</span></button></sc-for></div></sc-if>
          </sc-if>
          <sc-if value="{{sr.active}}" hint-placeholder-val="{{false}}">
            <sc-if value="{{sr.chips.length}}" hint-placeholder-val="{{false}}"><div class="chips"><sc-for list="{{sr.chips}}" as="c" hint-placeholder-count="3"><button class="chip {{c.cls}}" onClick="{{c.go}}">{{c.label}}</button></sc-for></div></sc-if>
            <sc-if value="{{sr.best}}" hint-placeholder-val="{{false}}"><div class="lab">{{t.best}}</div><button class="best" onClick="{{sr.best.go}}"><span class="tile"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{sr.best.icon}}"></path></svg></span><span class="tx"><b>{{sr.best.title}}</b><small>{{sr.best.sub}}</small></span><svg class="i s flip" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.chev}}"></path></svg></button></sc-if>
            <sc-for list="{{sr.groups}}" as="g" hint-placeholder-count="2"><div class="lab">{{g.label}}</div><div class="card"><sc-for list="{{g.items}}" as="e" hint-placeholder-count="2"><div class="row {{e.cls}}"><button class="row-m" onClick="{{e.go}}"><span class="tile sm"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="{{e.icon}}"></path></svg></span><span class="tx"><b class="one">{{e.h.a}}<mark>{{e.h.b}}</mark>{{e.h.c}}</b><small class="one">{{e.sub}}</small></span></button><sc-if value="{{e.add}}" hint-placeholder-val="{{false}}"><button class="plus" aria-label="{{t.createV}}" onClick="{{e.add}}"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.plus}}"></path></svg></button></sc-if></div></sc-for></div></sc-for>
            <sc-if value="{{sr.none}}" hint-placeholder-val="{{false}}"><div class="empty"><div class="tile lg m-core"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.search}}"></path></svg></div><b>{{t.noResults}}</b>{{t.noResultsSub}}</div></sc-if>
            <sc-if value="{{sr.hidden}}" hint-placeholder-val="{{false}}"><div class="note"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.shield}}"></path></svg>{{sr.hidden}}</div></sc-if>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{is.modules}}" hint-placeholder-val="{{false}}">
        <div class="pad stag"><sc-if value="{{modHint}}" hint-placeholder-val="{{true}}"><div class="mhint"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.pin}}"></path></svg>{{modHint}}</div></sc-if><sc-for list="{{modGroups}}" as="g" hint-placeholder-count="3"><div><div class="mcards {{g.jig}}" data-sort="{{g.key}}" style="margin-bottom:14px"><sc-for list="{{g.items}}" as="e" hint-placeholder-count="2"><div class="mc {{e.cls}}" data-id="{{e.id}}"><svg class="i big" viewBox="0 0 24 24" aria-hidden="true"><path d="{{e.icon}}"></path></svg><button class="mc-b" aria-label="{{e.title}}" title="{{e.title}}" onClick="{{e.go}}"><span class="tile solid"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{e.icon}}"></path></svg></span><b class="clamp">{{e.short}}</b></button></div></sc-for></div></div></sc-for></div>
      </sc-if>

      <sc-if value="{{is.hub}}" hint-placeholder-val="{{false}}">
        <div class="{{hub.cls}}">
          <div class="hubh"><small>{{hub.k.label}}</small><div class="kc-m"><span><b>{{hub.k.v}}<i>{{hub.k.s}}</i></b><br><span class="delta"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="{{hub.k.arrow}}"></path></svg>{{hub.k.d}}</span></span><span class="bars" aria-hidden="true"><sc-for list="{{hub.k.bars}}" as="b" hint-placeholder-count="7"><u style="height:{{b.h}}px" title="{{b.t}}"></u></sc-for></span></div></div>
          <sc-if value="{{hub.flow.length}}" hint-placeholder-val="{{false}}"><div class="flow"><h4>{{t.workflow}}</h4><div class="flw"><sc-for list="{{hub.flow}}" as="f" hint-placeholder-count="4"><button class="fs" onClick="{{f.go}}"><span class="n">{{f.n}}</span><span class="clamp">{{f.title}}</span></button></sc-for></div></div></sc-if>
          <sc-if value="{{hub.noFlow}}" hint-placeholder-val="{{false}}"><div style="height:16px"></div></sc-if>
          <div class="pad">
            <sc-if value="{{hub.creates.length}}" hint-placeholder-val="{{false}}"><div class="quick"><sc-for list="{{hub.creates}}" as="e" hint-placeholder-count="3"><button class="qk" onClick="{{e.go}}"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.plus}}"></path></svg>{{e.short}}</button></sc-for></div></sc-if>
            <div style="height:14px"></div>
            <sc-if value="{{hub.showTabs}}" hint-placeholder-val="{{true}}"><div class="seg"><sc-for list="{{hub.tabs}}" as="o" hint-placeholder-count="3"><button class="{{o.cls}}" onClick="{{o.go}}">{{o.label}}</button></sc-for></div></sc-if>
            <div class="sg {{hub.jig}}" data-sort="{{hub.key}}"><sc-for list="{{hub.items}}" as="e" hint-placeholder-count="4"><div class="sc" data-id="{{e.id}}"><button onClick="{{e.go}}"><span class="tile sm"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="{{e.icon}}"></path></svg></span><b class="clamp">{{e.title}}</b><small>{{e.meta}}</small></button></div></sc-for></div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{is.list}}" hint-placeholder-val="{{false}}">
        <div class="pad {{list.cls}}">
