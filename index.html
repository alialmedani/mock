<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP App Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDEFF3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:start;transition:transform .14s ease,background .16s ease,color .16s ease,opacity .16s ease}
.scr button:active{transform:scale(.965)}
.stage{width:1200px;height:892px;padding:16px 20px;display:flex;gap:32px;background:#EDEFF3;color:#2C3E50;font-family:Cairo,system-ui,sans-serif;font-size:14px;line-height:1.4;overflow:hidden}
.side{width:300px;flex:none;display:flex;flex-direction:column;gap:16px;padding-top:6px}
.side.r{width:390px;gap:8px}
.side h1{font-size:23px;line-height:1.2;font-weight:800;margin:0}
.side h2{font-size:12px;font-weight:700;color:#475569;margin:0 0 6px}
.side p{margin:4px 0 0;color:#475569;font-size:13px}
.rseg{display:flex;background:#DDE3EC;border-radius:11px;padding:3px;gap:3px}
.rseg button{flex:1;height:36px;border-radius:8px;text-align:center;font-weight:600;font-size:13px}
.rseg button.on{background:#2C3E50;color:#fff}
.jump{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.jump button{height:38px;padding:0 11px;border-radius:10px;background:#fff;font-size:13px;font-weight:600}
.jump button.on{background:#2C3E50;color:#fff}
.reset{height:38px;border-radius:10px;border:1px solid #B8C2D0;text-align:center;font-weight:600;font-size:13px}
.pc{display:block;width:100%;padding:9px 12px;border-radius:15px;background:#fff;border:2px solid transparent}
.pc.on{border-color:#006DFF}
.pc-h{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.pc-h>span:last-child{font-weight:600;font-size:12px;color:#475569}
.pc-r{display:block;font-size:12px;color:#475569;margin:0 0 6px}
.mini{display:flex;justify-content:space-around;align-items:center;height:38px;background:#F5F7FA;border-radius:12px;color:#475569}
.mini>span{display:flex;flex-direction:column;align-items:center;font-size:9.5px;line-height:1.1;width:68px;gap:1px}
.mini .i{width:14px;height:14px}

.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.i.s{width:18px;height:18px}.i.xs{width:14px;height:14px}.i.l{width:26px;height:26px}
[dir=rtl] .flip{transform:scaleX(-1)}
.phone{width:406px;height:860px;flex:none;padding:8px;border-radius:52px;background:#18212D;box-shadow:0 24px 50px rgba(44,62,80,.22)}
.scr{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;font-size:14px;line-height:1.4;--acc:#006DFF;--accT:#fff}
.t-light{--bg:#FAFAFA;--sf:#fff;--sf2:#EDEFF3;--ink:#2C3E50;--mut:#475569;--line:#EDEFF3;--hero:#2C3E50;--dock:#fff;--pri:#2C3E50;--priT:#fff;--link:#006DFF;--mk:#D6E7FF;--mkT:#032142;--logoT:#032142;--sh:0 1px 2px rgba(44,62,80,.04),0 10px 26px rgba(44,62,80,.06);--ok:#12703F;--okb:#DDF3E6;--warn:#7A4F00;--warnb:#FCEFCF;--bad:#B42318;--badb:#FDE5E1}
.t-dark{--bg:#222C3B;--sf:#2D3A4D;--sf2:#2D3A4D;--ink:#F7FAFF;--mut:#D0DAEC;--line:#425671;--hero:#18212D;--dock:#18212D;--pri:#2563EB;--priT:#fff;--link:#9ABEFF;--mk:#1F4A8C;--mkT:#fff;--logoT:#fff;--sh:none;--ok:#7FE0A8;--okb:#1D4634;--warn:#F6CF7A;--warnb:#4A3B18;--bad:#FFA99C;--badb:#55261F}
.m-sales{--m:#EA580C;--mb:#EA580C;--mt:rgba(234,88,12,.13)}.m-purchasing{--m:#7C3AED;--mb:#7C3AED;--mt:rgba(124,58,237,.13)}.m-inventory{--m:#0891B2;--mb:#0891B2;--mt:rgba(8,145,178,.13)}.m-finance{--m:#059669;--mb:#059669;--mt:rgba(5,150,105,.13)}.m-hr{--m:#2563EB;--mb:#2563EB;--mt:rgba(37,99,235,.13)}.m-mgmt{--m:#DB2777;--mb:#DB2777;--mt:rgba(219,39,119,.13)}.m-pos{--m:#DC2626;--mb:#DC2626;--mt:rgba(220,38,38,.13)}.m-dms{--m:#B45309;--mb:#B45309;--mt:rgba(180,83,9,.13)}.m-mfg{--m:#475569;--mb:#475569;--mt:rgba(71,85,105,.13)}.m-freight{--m:#0D9488;--mb:#0D9488;--mt:rgba(13,148,136,.13)}.m-forms{--m:#4338CA;--mb:#4338CA;--mt:rgba(67,56,202,.13)}.m-core{--m:#2C3E50;--mb:#2C3E50;--mt:rgba(44,62,80,.09)}
.t-dark .m-sales{--m:#FDBA8C;--mt:rgba(253,186,140,.18)}.t-dark .m-purchasing{--m:#C9B3FB;--mt:rgba(201,179,251,.18)}.t-dark .m-inventory{--m:#7DD8EA;--mt:rgba(125,216,234,.18)}.t-dark .m-finance{--m:#7CE3BB;--mt:rgba(124,227,187,.18)}.t-dark .m-hr{--m:#A9C2FF;--mt:rgba(169,194,255,.18)}.t-dark .m-mgmt{--m:#F8A8CB;--mt:rgba(248,168,203,.18)}.t-dark .m-pos{--m:#FBA9A9;--mt:rgba(251,169,169,.18)}.t-dark .m-dms{--m:#EBC08D;--mt:rgba(235,192,141,.18)}.t-dark .m-mfg{--m:#C5D0DE;--mt:rgba(197,208,222,.18)}.t-dark .m-freight{--m:#7FDFD3;--mt:rgba(127,223,211,.18)}.t-dark .m-forms{--m:#BCB8FA;--mt:rgba(188,184,250,.18)}.t-dark .m-core{--m:#F7FAFF;--mt:rgba(247,250,255,.11);--mb:#425671}

.tile{width:42px;height:42px;border-radius:13px;background:var(--mt);color:var(--m);display:flex;align-items:center;justify-content:center;flex:none}
.tile.sm{width:38px;height:38px;border-radius:12px}
.tile.lg{width:54px;height:54px;border-radius:17px}
.tile.solid{background:var(--mb);color:#fff}
.ava{width:40px;height:40px;border-radius:50%;background:var(--mt);color:var(--m);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}

.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:110px;scrollbar-width:none}
.view::-webkit-scrollbar,.hs::-webkit-scrollbar,.sheet-b::-webkit-scrollbar{display:none}
.view.nodock{padding-bottom:104px}
.nv-fw{animation:fw .24s cubic-bezier(.2,.8,.2,1)}.nv-bk{animation:bk .24s cubic-bezier(.2,.8,.2,1)}.nv-fade{animation:fd .2s ease-out}
[dir=rtl] .nv-fw{animation-name:bk}[dir=rtl] .nv-bk{animation-name:fw}
@keyframes fw{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes bk{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stag>*{animation:fd .34s cubic-bezier(.2,.8,.2,1) both}.stag>*:nth-child(2){animation-delay:.04s}.stag>*:nth-child(3){animation-delay:.08s}.stag>*:nth-child(4){animation-delay:.12s}.stag>*:nth-child(5){animation-delay:.16s}.stag>*:nth-child(6){animation-delay:.2s}
@keyframes jig{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.scr *{animation:none!important;transition:none!important}}
.pad{padding:0 16px}
.ib{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.ib.tint{background:var(--sf);color:var(--ink);box-shadow:var(--sh);border:1px solid var(--line)}
.ib.on{color:var(--link)}.ib.on .i{fill:var(--link)}
.dot{position:absolute;top:-4px;inset-inline-end:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--acc);color:#fff;border:2px solid var(--bg);font-size:10.5px;font-weight:800;line-height:15px;text-align:center}
.logo{width:96px;height:28px;display:block;flex:none}.logo .lt{fill:var(--logoT)}.grow{flex:1}
.wm{position:absolute;inset-inline-end:-34px;bottom:-46px;width:190px;height:158px;fill:#fff;opacity:.03;pointer-events:none}
.head{padding:16px 16px 0}
.head-top{display:flex;align-items:center;gap:8px}
.hello{margin-top:14px}
.hello b{display:block;font-size:25px;font-weight:800;line-height:1.25;letter-spacing:-.2px}
[dir=rtl] .hello b{letter-spacing:0}
.hello>span{display:block;font-size:13px;color:var(--mut);margin-top:1px}
.hs,.quick,.chips{cursor:grab}.dragging,.dragging *{cursor:grabbing!important;user-select:none}
.sbar{display:flex;align-items:center;gap:10px;height:54px;width:100%;margin-top:14px;padding:0 8px 0 16px;background:var(--sf);color:var(--mut);border:1px solid var(--line);border-radius:18px;font-weight:500;box-shadow:var(--sh)}
[dir=rtl] .sbar{padding:0 16px 0 8px}
.sbar>svg:first-child{color:var(--link)}
.sbar em{margin-inline-start:auto;font-style:normal;width:38px;height:38px;border-radius:12px;background:var(--sf2);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 16px;margin:0 -16px;scroll-padding:0 16px}
.hs>*{scroll-snap-align:start;flex:none}
.kc{position:relative;overflow:hidden;width:300px;min-height:132px;padding:15px 16px;border-radius:24px;background:var(--hero);color:#fff;display:block}
.kc.solo{width:358px}
.kc small{display:block;font-size:12.5px;color:#D0DAEC;font-weight:600}
.kc-m{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:4px}
.kc b{font-size:31px;font-weight:800;line-height:1.15}
.kc b i{font-style:normal;font-size:13px;font-weight:600;margin-inline-start:4px;color:#D0DAEC}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:#D0DAEC;margin-top:6px}
.bars{display:flex;align-items:flex-end;gap:4px;height:48px;flex:none}
.bars u{display:block;width:8px;min-height:4px;border-radius:4px 4px 0 0;background:rgba(255,255,255,.28)}
.bars u:last-child{background:#5AA2FF}
.chk{display:flex;align-items:center;gap:11px;padding:9px 9px 9px 12px;margin-top:10px;background:var(--sf);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
[dir=rtl] .chk{padding:9px 12px 9px 9px}
.chk .tx b{font-size:13.5px}
.cta{height:44px;padding:0 16px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:13px;flex:none}
.cta.alt{background:var(--sf2);color:var(--ink)}
.sec{margin-top:24px}
.sec-h{display:flex;align-items:center;justify-content:space-between;min-height:30px;margin-bottom:9px}
.sec-h h3{font-size:16.5px;font-weight:800;margin:0}
.lnk{min-height:44px;margin:-7px 0;padding:0 2px;font-size:13px;font-weight:700;color:var(--link)}
.pins{display:grid;gap:12px 8px}
.c1,.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pw{position:relative;min-width:0}
.pin{width:100%;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;font-size:12px;font-weight:700;line-height:1.25}
.pin .tile{width:60px;height:60px;border-radius:19px;box-shadow:0 8px 16px -8px var(--mb)}
.pin .i{width:26px;height:26px}
.pin.add .tile{background:none;border:1.5px dashed var(--mut);color:var(--mut);box-shadow:none}
.pin.add{color:var(--mut)}
.editing .pin .tile{animation:jig .32s ease-in-out infinite}
.pw:nth-child(even) .pin .tile{animation-delay:.1s}
.rm{position:absolute;top:-8px;inset-inline-end:calc(50% - 44px);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);animation:pop .2s}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rc{width:142px;padding:12px;background:var(--sf);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);display:block;min-height:112px}
.rc b{display:block;margin-top:9px;font-size:13px;font-weight:700;line-height:1.3}
.rc small{display:block;font-size:11.5px;color:var(--mut);margin-top:2px}
.tx{min-width:0;flex:1}
.tx b{display:block;font-size:14px;font-weight:700;line-height:1.3}
.tx small{display:block;font-size:12px;color:var(--mut);line-height:1.35}
.card{background:var(--sf);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;align-items:center;min-height:62px;padding-inline-end:8px;position:relative}
.row+.row::before,.rowsep{content:"";position:absolute;top:0;inset-inline-start:62px;inset-inline-end:0;height:1px;background:var(--line)}
.row-m{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 0;padding-inline-start:12px;min-height:62px}
.okb{width:44px;height:44px;border-radius:50%;background:var(--okb);color:var(--ok);display:flex;align-items:center;justify-content:center;flex:none}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 6px}
.mg{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;text-align:center;line-height:1.2;min-height:76px}
.mg .tile{width:52px;height:52px;border-radius:17px}
.mg.cur .tile{background:var(--mb);color:#fff}
.mcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mc{position:relative;overflow:hidden;border-radius:21px;background:var(--mt);min-height:128px}
.mc-b{display:block;width:100%;height:100%;padding:13px;min-height:128px}
.mc-b b{display:block;margin-top:13px;font-size:14.5px;font-weight:800;line-height:1.25}
.mc-b small{font-size:12px;color:var(--mut)}
.mc .big{position:absolute;inset-inline-end:-14px;bottom:-14px;width:78px;height:78px;color:var(--m);opacity:.12;stroke-width:1.3;pointer-events:none}
.mc .ib{position:absolute;top:2px;inset-inline-end:2px;color:var(--mut)}.mc .ib.on{color:var(--link)}

.bar{display:flex;align-items:center;gap:2px;min-height:60px;padding:8px;flex:none;position:relative;z-index:1}
.bar-t{flex:1;min-width:0;padding:0 6px}
.bar-t h2{font-size:19px;font-weight:800;margin:0;line-height:1.25}
.crumb{display:inline-flex;align-items:center;min-height:18px;font-size:12px;font-weight:600;color:var(--mut)}
.bar.band{background:color-mix(in srgb,var(--mb) 76%,#0B1726);color:#fff;margin-bottom:-1px;box-shadow:0 1px 0 color-mix(in srgb,var(--mb) 76%,#0B1726)}
.band .crumb{color:#fff}.band .ib.on{color:#fff}.band .ib.on .i{fill:#fff}
.hubh{position:relative;overflow:hidden;background:color-mix(in srgb,var(--mb) 76%,#0B1726);color:#fff;padding:2px 18px 46px;border-radius:0 0 28px 28px}
.hubh small{font-size:12.5px;font-weight:600;color:#fff;opacity:.9;display:block}
.hubh b{font-size:30px;font-weight:800;line-height:1.2}
.hubh b i{font-style:normal;font-size:13px;font-weight:600;margin-inline-start:4px}
.hubh .bars u{background:rgba(255,255,255,.34)}.hubh .bars u:last-child{background:#fff}
.hubh .delta{color:#fff}
.flow{margin:-32px 16px 0;position:relative;padding:12px 6px 10px;background:var(--sf);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
.flow h4{margin:0 8px 8px;font-size:12.5px;font-weight:700;color:var(--mut)}
.flw{display:flex}
.fs{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;text-align:center;line-height:1.2;position:relative;min-height:66px}
.fs+.fs::before{content:"";position:absolute;top:17px;inset-inline-end:calc(50% + 21px);width:calc(100% - 42px);height:2px;background:var(--line)}
.fs span.n{width:36px;height:36px;border-radius:50%;background:var(--mt);color:var(--m);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:14px 16px 2px}
.qk{display:flex;align-items:center;gap:6px;height:42px;padding:0 14px 0 10px;border-radius:21px;background:var(--mt);color:var(--ink);font-size:12.5px;font-weight:700;white-space:nowrap;flex:none}
[dir=rtl] .qk{padding:0 10px 0 14px}
.qk .i{color:var(--m)}
.sg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.sc{position:relative;background:var(--sf);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.sc>button:first-child{display:block;width:100%;padding:12px;min-height:112px}
.sc b{display:block;margin-top:9px;font-size:13.5px;font-weight:700;line-height:1.25}
.sc small{font-size:12px;color:var(--mut)}
.sc .ib{position:absolute;top:2px;inset-inline-end:2px;color:var(--mut)}.sc .ib.on{color:var(--link)}
.seg{display:flex;background:var(--sf2);padding:3px;border-radius:13px;gap:3px}
.seg button{flex:1;height:38px;border-radius:10px;text-align:center;font-size:12.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--sf);color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(44,62,80,.12)}
.t-dark .seg button.on{background:#425671}

.field{display:flex;align-items:center;gap:9px;height:50px;padding:0 14px;background:var(--sf);border:1.5px solid var(--line);border-radius:16px;color:var(--mut);transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(0,109,255,.14)}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--ink);font-weight:500}
.field input::placeholder{color:var(--mut)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:11px 16px;margin:0 -16px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding-bottom:0}
.chip{height:38px;padding:0 14px;border-radius:19px;background:var(--sf);border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap;flex:none}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--priT)}
mark{background:var(--mk);color:var(--mkT);border-radius:4px;padding:0 1px}mark:empty{display:none}
.best{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:20px;background:var(--pri);color:var(--priT)}
.best small{color:inherit;opacity:.88}.best .tile{background:rgba(255,255,255,.15);color:#fff}
.lab{font-size:12.5px;font-weight:700;color:var(--mut);margin:18px 0 8px}
.note{display:flex;gap:7px;align-items:center;padding:13px 4px;font-size:12.5px;color:var(--mut)}
.plus{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--link);flex:none}
.sum{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mut);margin:0 2px 10px}
.st{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:11.5px;font-weight:700;flex:none}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-draft{background:var(--sf2);color:var(--mut)}.st-pending{background:var(--warnb);color:var(--warn)}.st-posted{background:var(--okb);color:var(--ok)}
.dl{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;min-height:66px;position:relative}
.dl+.dl::before{content:"";position:absolute;top:0;inset-inline:64px 0;height:1px;background:var(--line)}
.dl-e{text-align:end;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.dl-e b{font-size:13px;font-weight:700}
.fab{position:absolute;bottom:98px;inset-inline-end:16px;height:54px;padding:0 20px 0 15px;display:flex;align-items:center;gap:6px;border-radius:19px;background:var(--acc);color:#fff;font-weight:700;box-shadow:0 10px 22px -6px rgba(0,109,255,.55);z-index:2;animation:pop .28s}
[dir=rtl] .fab{padding:0 15px 0 20px}
.btn{height:50px;padding:0 16px;border-radius:16px;background:var(--pri);color:var(--priT);font-weight:700;text-align:center;flex:1}
.btn.blue{background:var(--acc);color:#fff}
.btn.alt{background:var(--sf2);color:var(--ink)}
.btn.sm{height:44px;font-size:13px;border-radius:13px}
.act{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:9px;padding:11px 16px 22px;background:var(--sf);border-top:1px solid var(--line);z-index:2}
.act .tot{flex:1;min-width:0}.act .tot small{display:block;font-size:11.5px;color:var(--mut)}.act .tot b{font-weight:800;font-size:15px}
.rcp{position:relative;background:var(--sf);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh)}
.rcp-t{padding:17px 16px 16px;text-align:center}
.rcp-t b.big{display:block;font-size:29px;font-weight:800;line-height:1.2;margin-top:9px}
.rcp-t span.p{display:block;color:var(--mut);font-size:13px}
.perf{position:relative;border-top:2px dashed var(--line)}
.perf::before,.perf::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-10px}.perf::after{right:-10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 16px;font-size:13px}
.kv>span{color:var(--mut)}.kv>b{font-weight:600;text-align:end}
.ln{display:flex;justify-content:space-between;gap:10px;padding:9px 16px;font-size:13px}
.ln small{display:block;color:var(--mut);font-size:12px}.ln b{font-weight:700}
.tl{display:flex;margin:14px 0 2px}
.tl div{flex:1;text-align:center;font-size:11.5px;font-weight:600;color:var(--mut);position:relative}
.tl i{display:flex;width:26px;height:26px;margin:0 auto 4px;border-radius:50%;background:var(--sf2);color:var(--mut);align-items:center;justify-content:center;position:relative;z-index:1}
.tl div+div::before{content:"";position:absolute;top:12px;inset-inline-end:50%;width:100%;height:2px;background:var(--sf2)}
.tl .done i,.tl .cur i{background:var(--acc);color:#fff}.tl .done,.tl .cur{color:var(--ink)}
.tl .done::before,.tl .cur::before{background:var(--acc)!important}
.steps{display:flex;gap:5px;margin-bottom:6px}.steps u{flex:1;height:5px;border-radius:3px;background:var(--sf2)}.steps u.on{background:var(--acc)}
.stepl{font-size:12.5px;color:var(--mut);margin-bottom:12px}
.lbl{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.err{color:var(--bad);font-size:12.5px;font-weight:600;margin-top:6px}
.qty{display:flex;align-items:center;gap:2px;flex:none}
.qty button{width:40px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--link)}
.qty b{min-width:22px;text-align:center;font-weight:800}
.empty{text-align:center;padding:44px 26px;color:var(--mut);font-size:13px}
.empty .tile{margin:0 auto 12px}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:3px}
.ix{padding:13px;background:var(--sf);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);margin-bottom:10px}
.ix-t{display:flex;gap:11px;align-items:center;width:100%}
.ix-b{display:flex;gap:8px;margin-top:11px}
.ac{position:relative;overflow:hidden;padding:18px 16px 16px;border-radius:26px;background:var(--hero);color:#fff;text-align:center}
.ring{position:relative;width:176px;height:176px;margin:0 auto}
.ring svg{width:176px;height:176px;display:block}
.ring .rc0{fill:none;stroke:rgba(255,255,255,.14);stroke-width:9}
.ring .rc1{fill:none;stroke:#5AA2FF;stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .5s}
.ring>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:32px;font-weight:800;line-height:1.1}.ring small{font-size:12px;color:#D0DAEC}
.ac .cta{width:100%;height:50px;margin-top:14px;text-align:center;display:flex;align-items:center;justify-content:center;gap:7px;border-radius:16px}
.wk{display:flex;justify-content:space-between;padding:13px 14px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--mut)}
.wk i{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sf2);color:var(--mut)}
.wk .y i{background:var(--okb);color:var(--ok)}.wk .t i{background:var(--acc);color:#fff}
.st2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st2 div{padding:13px;background:var(--sf);border:1px solid var(--line);border-radius:18px}
.st2 b{display:block;font-size:24px;font-weight:800;line-height:1.2}.st2 small{font-size:12px;color:var(--mut)}
.idc{position:relative;overflow:hidden;padding:17px;border-radius:24px;background:var(--hero);color:#fff}
.idc-t{display:flex;align-items:center;gap:12px}
.idc .av{width:56px;height:56px;border-radius:18px;background:#006DFF;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.idc b{display:block;font-size:18px;font-weight:800;line-height:1.25}.idc small{color:#D0DAEC;font-size:12.5px}
.idc-b{display:flex;gap:24px;margin-top:15px;font-size:12px;color:#D0DAEC}.idc-b strong{display:block;color:#fff;font-size:14px;font-weight:700}
.scan{position:relative;height:370px;margin-top:6px;border-radius:26px;background:var(--hero);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:13px}
.scan i{position:relative;width:176px;height:176px;border-radius:24px;border:3px solid #5AA2FF;display:block}
.scan i::after{content:"";position:absolute;left:12px;right:12px;top:50%;height:2px;background:#5AA2FF}

.dock{position:absolute;left:12px;right:12px;bottom:12px;height:74px;display:flex;align-items:stretch;padding:5px 3px;background:var(--dock);border:1px solid var(--line);border-radius:27px;color:var(--mut);box-shadow:0 14px 30px rgba(44,62,80,.17);z-index:3}
.dk{border-radius:18px;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;line-height:1.2;text-align:center}
.dk-i{width:48px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.dk.on{color:var(--link);font-weight:800}.dk.on .dk-i{background:var(--acc);color:#fff;animation:pop .26s}
.dk-l{display:flex;align-items:center;gap:1px;max-width:100%}.dk-l .one{max-width:60px}
.dk.search .dk-i{width:54px;height:54px;border-radius:19px;background:var(--acc);color:#fff;box-shadow:0 8px 16px -6px rgba(0,109,255,.6)}
.dk.search.on .dk-i{outline:2px solid var(--link);outline-offset:2px}
.toast{position:absolute;left:16px;right:16px;bottom:98px;min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 8px 5px 15px;border-radius:16px;background:#18212D;color:#fff;font-weight:600;font-size:13px;z-index:6;animation:up .2s}
[dir=rtl] .toast{padding:5px 15px 5px 8px}
.toast button{height:40px;padding:0 11px;color:#9ABEFF;font-weight:800}
.scrim{position:absolute;inset:0;background:rgba(24,33,45,.55);z-index:4}
.scrim button.bg{position:absolute;inset:0;width:100%;height:100%}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--bg);border-radius:28px 28px 0 0;padding:8px 16px 22px;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--mut);opacity:.4;margin:0 auto 7px;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.sheet-h h3{font-size:18px;font-weight:800;margin:0}.sheet-h small{display:block;font-size:12px;color:var(--mut);font-weight:500}
.sheet-b{overflow-y:auto;min-height:0;margin-top:8px;scrollbar-width:none}
.dlg{position:absolute;left:24px;right:24px;top:300px;padding:22px;border-radius:24px;background:var(--sf);text-align:center}
.dlg h3{margin:0;font-size:18px;font-weight:800}.dlg p{margin:6px 0 16px;color:var(--mut);font-size:13px}
.row2{display:flex;gap:9px}
.bad{color:var(--bad)}
.pg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pb{height:42px;padding:0 6px;border-radius:10px;background:#fff;font-size:12px;font-weight:700;text-align:center}
.pb.on{background:#2C3E50;color:#fff}
.tg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tgl{display:flex;align-items:center;gap:7px;height:42px;padding:0 9px;border-radius:10px;background:#fff;font-size:12.5px;font-weight:600;color:#475569}
.tgl i{width:9px;height:9px;border-radius:50%;background:var(--mb);flex:none}
.tgl>span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgl u{position:relative;width:30px;height:18px;border-radius:9px;background:#B8C2D0;flex:none;transition:background .15s}
.tgl u::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.tgl.on{color:#2C3E50}.tgl.on u{background:#006DFF}.tgl.on u::after{left:14px}
.minis{display:flex;gap:6px;margin-top:6px}
.minis button{flex:1;height:36px;border-radius:9px;border:1px solid #B8C2D0;text-align:center;font-size:12.5px;font-weight:600}
.fst{display:flex;align-items:center;gap:6px;margin:0 0 12px}
.fst b{width:24px;height:24px;border-radius:50%;background:var(--sf2);color:var(--mut);font-size:11.5px;display:flex;align-items:center;justify-content:center;flex:none}
.fst div>span{font-size:12px;color:var(--mut);white-space:nowrap}
.fst em{flex:1;height:2px;min-width:8px;background:var(--sf2)}
.fst .on b{background:var(--acc);color:#fff}.fst .on>span{color:var(--ink);font-weight:700}.fst em.on{background:var(--acc)}
.fst div{display:flex;align-items:center;gap:5px}
.fc{padding:14px;margin-bottom:12px;background:var(--sf);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.fc.bad{border-color:var(--bad)}
.fc h4{margin:0 0 10px;font-size:14px;font-weight:800}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
.ff{min-width:0}.ff.full{grid-column:1/-1}
.fl{display:block;margin-bottom:5px;font-size:12.5px;font-weight:600;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl b{color:var(--bad)}
.fi{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;height:46px;padding:0 12px;background:var(--bg);border:1.3px solid var(--line);border-radius:13px;color:var(--ink);font-size:13.5px;font-weight:500;outline:0}
.fi:focus{border-color:var(--acc)}.fi.bad{border-color:var(--bad)}.fi.ro{background:var(--sf2);color:var(--mut)}
.fi .ph{color:var(--mut)}
.ckb{display:flex;align-items:center;gap:7px;width:100%;height:46px;padding:0 10px;background:var(--bg);border:1.3px solid var(--line);border-radius:13px;font-size:12.5px;font-weight:600}
.ckb i{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--mut);color:#fff;flex:none}
.ckb.on i{background:var(--acc);border-color:var(--acc)}
.lh{display:flex;align-items:center;justify-content:space-between;min-height:36px}
.lh h4{margin:0}.lh button{display:flex;align-items:center;gap:3px;min-height:44px;color:var(--link);font-size:13px;font-weight:700}
.lr{display:flex;align-items:center;gap:6px}.lr>button:first-child{flex:1;min-width:0;padding:8px 0}
.lr b{display:block;font-size:13.5px}.lr small{display:block;font-size:11.5px;color:var(--mut)}.lr strong{font-size:12.5px;flex:none}
.nt{padding:12px;margin-top:12px;border-radius:14px;background:var(--warnb);color:var(--warn);font-size:12.5px;line-height:1.5}
.rb{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:8px;min-height:30px;font-size:12px}
.rb>span{color:var(--mut)}.rb>i{height:8px;border-radius:4px;background:var(--sf2);overflow:hidden;display:block}.rb>i>u{display:block;height:100%;background:var(--acc);border-radius:4px}.rb>b{font-size:12px}
.pp{position:relative;display:block;width:100%;padding:12px;min-height:112px}.pp b{display:block;margin-top:9px;font-size:13px}.pp small{font-size:12px;color:var(--mut)}.pp .dot{top:8px;inset-inline-end:8px;font-style:normal}
.scr button:focus-visible,.stage button:focus-visible{outline:2px solid #006DFF;outline-offset:2px}

html,body{height:100%}
body:not(.narrow) .stage{margin:0 auto;overflow:visible}
body.narrow{height:auto}
body.narrow .stage{width:auto;height:auto;min-height:100vh;flex-direction:column;align-items:center;padding:6px 6px 28px;gap:20px;overflow:visible}
body.narrow .side,body.narrow .side.r{width:100%;max-width:420px;padding:0 8px}
body.narrow .phone{order:-1}</style>

<body>
<div id="app"></div>
<template id="view">

<div class="stage">
  <div class="side">
    <div><h1>App redesign</h1><p>Everything inside the phone works. All names and figures are sample data.</p></div>
    <div><h2>Language</h2><div class="rseg"><sc-for list="{{langs}}" as="o" hint-placeholder-count="2"><button class="{{o.cls}}" onClick="{{o.go}}">{{o.label}}</button></sc-for></div></div>
    <div><h2>Theme</h2><div class="rseg"><sc-for list="{{themes}}" as="o" hint-placeholder-count="2"><button class="{{o.cls}}" onClick="{{o.go}}">{{o.label}}</button></sc-for></div></div>
    <div><h2>Jump to a screen</h2><div class="jump"><sc-for list="{{jumps}}" as="o" hint-placeholder-count="10"><button class="{{o.cls}}" onClick="{{o.go}}">{{o.label}}</button></sc-for></div></div>
    <button class="reset" onClick="{{reset}}">Reset the demo</button>
  </div>

  <div class="phone"><div class="scr {{themeCls}}" dir="{{dir}}" lang="{{lang}}">

    <sc-if value="{{hasBar}}" hint-placeholder-val="{{false}}">
      <div class="bar {{barCls}}">
        <sc-if value="{{canBack}}" hint-placeholder-val="{{false}}"><button class="ib" aria-label="{{t.back}}" onClick="{{back}}"><svg class="i flip" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.back}}"></path></svg></button></sc-if>
        <div class="bar-t">
          <sc-if value="{{crumb}}" hint-placeholder-val="{{false}}"><button class="crumb" onClick="{{crumb.go}}">{{crumb.label}}</button></sc-if>
          <h2 class="one">{{barTitle}}</h2>
        </div>
        <sc-if value="{{barPin}}" hint-placeholder-val="{{false}}"><button class="ib {{barPin.cls}}" aria-label="{{barPin.label}}" aria-pressed="{{barPin.pressed}}" onClick="{{barPin.go}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.pin}}"></path></svg></button></sc-if>
      </div>
    </sc-if>

    <div class="view {{viewCls}} nv-{{nav}}" key="{{viewKey}}">

      <sc-if value="{{is.home}}" hint-placeholder-val="{{true}}">
        <div class="head">
          <div class="head-top">
            <svg class="logo" viewBox="30 390 1033 300" role="img" aria-label="ERP"><path fill="#006DFF" d="M376.01,399.98v255.86h-100.02v-155.84H120.15v-100.02h255.86Z"></path><path fill="#006DFF" d="M40.39,589.34h59.17c12.03,0,23.56-4.77,32.06-13.28l38.11-38.11,64.11,64.11-38.11,38.11c-25.51,25.51-60.1,39.84-96.18,39.84h-59.17v-90.67h.01Z"></path><path class="lt" d="M414.15,403.95c0-2.5,1.25-3.76,3.76-3.76h163.78c2.5,0,3.76,1.26,3.76,3.76v40.19c0,2.51-1.26,3.76-3.76,3.76h-110.06c-1.5,0-2.25.75-2.25,2.25v50.71c0,1.5.75,2.25,2.25,2.25h91.66c2.5,0,3.76,1.25,3.76,3.76v39.82c0,2.51-1.26,3.76-3.76,3.76h-91.66c-1.5,0-2.25.75-2.25,2.25v52.97c0,1.5.75,2.25,2.25,2.25h110.06c2.5,0,3.76,1.26,3.76,3.76v40.19c0,2.51-1.26,3.76-3.76,3.76h-163.78c-2.51,0-3.76-1.25-3.76-3.76v-247.93h0Z"></path><path class="lt" d="M767.64,655.63c-2.76,0-4.64-1.25-5.63-3.76l-43.95-93.54h-34.18c-1.5,0-2.25.75-2.25,2.25v91.28c0,2.51-1.26,3.76-3.76,3.76h-47.71c-2.51,0-3.76-1.25-3.76-3.76v-247.93c0-2.5,1.25-3.76,3.76-3.76h101.8c13.02,0,24.85,1.94,35.5,5.82,10.64,3.89,19.78,9.33,27.42,16.34,7.64,7.01,13.52,15.4,17.66,25.17,4.13,9.77,6.2,20.41,6.2,31.93,0,16.53-4.01,30.93-12.02,43.2-8.02,12.27-19.16,21.54-33.43,27.8l50.34,100.67c.5,1.26.5,2.32,0,3.19-.5.88-1.38,1.32-2.63,1.32h-53.34l-.02.02ZM728.94,511.39c10.52,0,18.91-2.88,25.17-8.64s9.39-13.52,9.39-23.29-3.13-17.15-9.39-22.91-14.65-8.64-25.17-8.64h-45.08c-1.5,0-2.25.75-2.25,2.25v58.98c0,1.5.75,2.25,2.25,2.25h45.08Z"></path><path class="lt" d="M864.55,655.63c-2.51,0-3.76-1.25-3.76-3.76v-247.93c0-2.5,1.25-3.76,3.76-3.76h99.17c13.77,0,26.17,2.01,37.19,6.01,11.02,4.01,20.41,9.64,28.17,16.9,7.76,7.27,13.65,15.91,17.65,25.92,4,10.02,6.01,21.17,6.01,33.43s-2.07,23.04-6.2,33.06c-4.13,10.02-10.02,18.66-17.65,25.92-7.64,7.27-16.97,12.9-27.99,16.9-11.02,4.01-23.42,6.01-37.19,6.01h-45.45c-1.5,0-2.25.75-2.25,2.25v85.27c0,2.51-1.26,3.76-3.76,3.76h-47.71v.02ZM960.34,516.65c11.77,0,20.91-3.06,27.42-9.2,6.51-6.13,9.77-14.46,9.77-24.98s-3.26-18.91-9.77-25.17-15.65-9.39-27.42-9.39h-42.07c-1.5,0-2.25.75-2.25,2.25v64.23c0,1.5.75,2.25,2.25,2.25h42.07Z"></path></svg>
            <span class="grow"></span>
            <sc-if value="{{showQr}}" hint-placeholder-val="{{false}}"><button class="ib tint" aria-label="{{t.scan}}" onClick="{{goScan}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.qr}}"></path></svg></button></sc-if>
            <button class="ib tint" aria-label="{{t.inbox}}" onClick="{{goInbox}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.bell}}"></path></svg><sc-if value="{{inboxN}}" hint-placeholder-val="{{false}}"><span class="dot">{{inboxN}}</span></sc-if></button>
          </div>
          <div class="hello"><b>{{t.morning}}, {{P.first}}</b><span>{{t.dateLine}}</span></div>
          <button class="sbar" onClick="{{goSearch}}"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.search}}"></path></svg>{{t.searchHint}}</button>
        </div>
        <div class="pad stag">
          <sc-if value="{{kpis.length}}" hint-placeholder-val="{{true}}">
            <div style="margin-top:14px"><div class="hs">
              <sc-for list="{{kpis}}" as="k" hint-placeholder-count="2">
